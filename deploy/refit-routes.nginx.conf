# Include inside the refit.team server block. Keep the existing API and uploads
# locations and the root directive. Replace any existing frontend location /.
location = / { try_files /index.html =404; }
location = /introduce { return 301 /$is_args$args; }
location = /introduce/ { return 301 /$is_args$args; }
location = /introduce.html { return 301 /$is_args$args; }

location ~ ^/(faq|login|signup|terms|privacy)/?$ {
    try_files /$1.html =404;
}
location ~ ^/(student|teacher|personal-info|class/[^/]+|teacher/class/[^/]+(/management)?)/?$ {
    try_files /app.html =404;
}
location ~ ^/(index|faq|login|signup|terms|privacy|app|404)\.html$ {
    internal;
}

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location / {
    try_files $uri =404;
}

error_page 404 /404.html;
gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;
